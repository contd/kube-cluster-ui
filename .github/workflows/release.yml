name: Build and publish desktop binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  test-unit:
    name: Unit tests
    runs-on: ubuntu-22.04
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npx vitest run --reporter=html --outputFile=reports/unit/index.html

      - name: Upload unit test HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-html-report
          path: reports/unit
          if-no-files-found: warn

  test-e2e:
    name: E2E tests
    runs-on: ubuntu-22.04
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium chromium-headless-shell

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload E2E HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-html-report
          path: reports/e2e
          if-no-files-found: warn

  publish-test-reports:
    name: Publish test reports to wiki
    runs-on: ubuntu-22.04
    needs: [test-unit, test-e2e]
    if: always() && !cancelled()
    env:
      WIKI_TOKEN: ${{ secrets.WIKI_TOKEN }}
    permissions:
      contents: read

    steps:
      - name: Download unit test report
        if: always()
        uses: actions/download-artifact@v4
        with:
          name: unit-test-html-report
          path: report-input/unit
          if-no-artifact-found: warn

      - name: Download E2E test report
        if: always()
        uses: actions/download-artifact@v4
        with:
          name: e2e-test-html-report
          path: report-input/e2e
          if-no-artifact-found: warn

      - name: Publish reports as wiki entries
        if: env.WIKI_TOKEN != ''
        run: |
          set -euo pipefail

          git clone "https://x-access-token:${WIKI_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" wiki
          wiki_branch="$(git -C wiki branch --show-current)"
          report_id="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          report_dir="test-reports/${report_id}"
          mkdir -p "wiki/${report_dir}"

          if [ -d report-input/unit ]; then
            cp -R report-input/unit "wiki/${report_dir}/unit"
          fi
          if [ -d report-input/e2e ]; then
            cp -R report-input/e2e "wiki/${report_dir}/e2e"
          fi

          raw_base="https://raw.githubusercontent.com/wiki/${GITHUB_REPOSITORY}/${wiki_branch}/${report_dir}"
          report_page="Test-Reports-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}.md"
          cat > "wiki/${report_page}" <<EOF
          # Test reports: run ${GITHUB_RUN_NUMBER}

          Trigger: ${GITHUB_EVENT_NAME}

          Ref: ${GITHUB_REF_NAME}

          Commit: [${GITHUB_SHA}](https://github.com/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA})

          - [Unit test HTML report](${raw_base}/unit/index.html)
          - [End-to-end HTML report](${raw_base}/e2e/index.html)
          - [GitHub Actions run](https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})
          EOF

          if [ ! -f wiki/Home.md ]; then
            printf '# Home\n' > wiki/Home.md
          fi
          if ! grep -q '^## Automated test reports$' wiki/Home.md; then
            printf '\n## Automated test reports\n\n' >> wiki/Home.md
          fi
          home_entry="- [Run ${GITHUB_RUN_NUMBER}, attempt ${GITHUB_RUN_ATTEMPT}](${report_page%.md})"
          if ! grep -Fq -- "${home_entry}" wiki/Home.md; then
            printf '%s\n' "${home_entry}" >> wiki/Home.md
          fi

          git -C wiki config user.name 'github-actions[bot]'
          git -C wiki config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C wiki add "${report_dir}" "${report_page}" Home.md
          git -C wiki commit -m "Add test reports for run ${GITHUB_RUN_NUMBER}"
          git -C wiki push origin "${wiki_branch}"

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    needs: [test-unit, test-e2e]
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application bundles
        run: npm run package:builder

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kube-cluster-ui-windows
          path: |
            dist/*
            !**/*.blockmap

      - name: Publish to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
            !**/*.blockmap
          draft: false
          generate_release_notes: true

  build-macos:
    name: Build macOS
    runs-on: macos-latest
    needs: [test-unit, test-e2e]
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application bundles
        run: npm run package:builder

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kube-cluster-ui-macos
          path: |
            dist/*
            !**/*.blockmap

      - name: Publish to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
            !**/*.blockmap
          draft: false
          generate_release_notes: true

  build-linux:
    name: Build Linux
    runs-on: ubuntu-22.04
    needs: [test-unit, test-e2e]
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application bundles
        run: npm run package:builder

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kube-cluster-ui-linux
          path: |
            dist/*
            !**/*.blockmap

      - name: Publish to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
            !**/*.blockmap
          draft: false
          generate_release_notes: true
