name: Build and publish desktop binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            artifact: kube-cluster-ui-windows
            package_dir: out/make/squirrel.windows/x64
          - name: macos
            os: macos-latest
            artifact: kube-cluster-ui-macos
            package_dir: out/make
          - name: linux
            os: ubuntu-latest
            artifact: kube-cluster-ui-linux
            package_dir: out/make

    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application bundles
        run: npm run make

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.package_dir }}/**
            !**/*.blockmap

      - name: Publish to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.package_dir }}/**
            !**/*.blockmap
          draft: false
          generate_release_notes: true
