name: Build and publish desktop binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  test-unit:
    name: Unit tests
    runs-on: ubuntu-22.04
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit

  test-e2e:
    name: E2E tests
    runs-on: ubuntu-22.04
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium chromium-headless-shell

      - name: Run E2E tests
        run: npm run test:e2e

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    needs: [test-unit, test-e2e]
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application bundles
        run: npm run package:builder

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kube-cluster-ui-windows
          path: |
            dist/*
            !**/*.blockmap

      - name: Publish to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
            !**/*.blockmap
          draft: false
          generate_release_notes: true

  build-macos:
    name: Build macOS
    runs-on: macos-latest
    needs: [test-unit, test-e2e]
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application bundles
        run: npm run package:builder

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kube-cluster-ui-macos
          path: |
            dist/*
            !**/*.blockmap

      - name: Publish to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
            !**/*.blockmap
          draft: false
          generate_release_notes: true

  build-linux:
    name: Build Linux
    runs-on: ubuntu-22.04
    needs: [test-unit, test-e2e]
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application bundles
        run: npm run package:builder

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kube-cluster-ui-linux
          path: |
            dist/*
            !**/*.blockmap

      - name: Publish to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
            !**/*.blockmap
          draft: false
          generate_release_notes: true
